[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-align"
version = "0.1.0"
description = "Build and optimize AI Functions with pluggable evaluators and GEPA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gepa[full]>=0.1.4,<0.2",
  "pyarrow>=25,<26",
  "pydantic>=2.10,<3",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
  "typesafe-sdk>=0.7,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]

[project.scripts]
jev-align = "jev_align.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_align"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
