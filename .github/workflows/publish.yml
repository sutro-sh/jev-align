name: Publish to PyPI

on:
  release:
    types: [published]

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jev-align
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(uv version --short)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_NAME}" != v* || "${tag_version}" != "${package_version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi

      - name: Install development dependencies
        run: uv sync --locked --extra dev --python 3.11

      - name: Run tests
        run: uv run --no-active --quiet pytest

      - name: Run lint
        run: uv run --no-active --quiet ruff check src tests

      - name: Build distributions
        run: uv run --no-active --no-sync python scripts/build_release.py --out-dir dist/pypi

      - name: Check distribution metadata
        run: uvx twine check dist/pypi/*

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi/

  report-failure:
    name: Report publish failure
    if: ${{ always() && needs.publish.result == 'failure' }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Add prominent failure notice
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error title=PyPI release failed::${GITHUB_REF_NAME} was not fully published. Inspect all three PyPI projects. ${RUN_URL}"
          {
            echo "## ❌ PyPI release failed"
            echo
            echo "**${GITHUB_REF_NAME} was not fully published.** Some distributions may already be available on PyPI."
            echo
            echo "Inspect the [failed workflow run](${RUN_URL}), fix the problem, and release a new version."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Open or update a release failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const title = `PyPI release failed: ${tag}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The publish workflow failed, so **${tag} may be only partially available on PyPI**.`,
              'Check jev-align, decision-align, and decal before recovering the release.',
              '',
              `Failed run: ${runUrl}`,
              '',
              'Fix the failing job, bump the package version, and create a new release.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
              });
            }
